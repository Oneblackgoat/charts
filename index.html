<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Index Charts</title>
    <style>
        body {
            background-color: #0F0F0F; /* Dark background */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container for each chart section */
        .chart-block {
            width: 100%;
            margin-bottom: 15px; /* Space between charts */
            background-color: #1a1a1a;
        }

        /* The Label Bar */
        .label-bar {
            background-color: #2a2e39; /* Blue-grey separator */
            color: #ffffff;
            padding: 12px 15px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            border-top: 1px solid #444;
            border-bottom: 1px solid #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* The Chart Image */
        .chart-img {
            width: 100%;       /* Forces image to fit iPhone width */
            height: auto;      /* Maintains aspect ratio */
            display: block;    /* Removes bottom gap */
        }
    </style>
</head>
<body>

    <div class="chart-block">
        <div class="label-bar">SPY Weekly</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=SPY&p=W&b=5&g=0&i=t0013046303c" alt="SPY Weekly">
    </div>

    <div class="chart-block">
        <div class="label-bar">SPY Daily</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=SPY&p=D&b=5&g=0&i=t6581946801c" alt="SPY Daily">
    </div>

    <div class="chart-block">
        <div class="label-bar">SH Daily</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=SH&p=D&b=5&g=0&i=t6581946801c" alt="SH Daily">
    </div>

    <div class="chart-block">
        <div class="label-bar">QQQ Weekly</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=QQQ&p=W&b=5&g=0&i=t0013046303c" alt="QQQ Weekly">
    </div>

    <div class="chart-block">
        <div class="label-bar">QQQ Daily</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=QQQ&p=D&b=5&g=0&i=t6581946801c" alt="QQQ Daily">
    </div>

    <div class="chart-block">
        <div class="label-bar">PSQ Daily</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=PSQ&p=D&b=5&g=0&i=t6581946801c" alt="PSQ Daily">
    </div>

    <div class="chart-block">
        <div class="label-bar">IWM Weekly</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=IWM&p=W&b=5&g=0&i=t0013046303c" alt="IWM Weekly">
    </div>

    <div class="chart-block">
        <div class="label-bar">IWM Daily</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=IWM&p=D&b=5&g=0&i=t6581946801c" alt="IWM Daily">
    </div>

    <div class="chart-block">
        <div class="label-bar">RWM Daily</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=RWM&p=D&b=5&g=0&i=t6581946801c" alt="RWM Daily">
    </div>

    <div class="chart-block">
        <div class="label-bar">TLT Weekly</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=TLT&p=W&b=5&g=0&i=t0013046303c" alt="TLT Weekly">
    </div>

    <div class="chart-block">
        <div class="label-bar">TLT Daily</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=TLT&p=D&b=5&g=0&i=t6581946801c" alt="TLT Daily">
    </div>

</body>
</html>
