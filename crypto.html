<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Crypto Charts</title>
    <style>
        body {
            background-color: #0F0F0F;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .chart-block {
            width: 100%;
            margin-bottom: 15px;
            background-color: #1a1a1a;
        }

        .label-bar {
            background-color: #2a2e39;
            color: #ffffff;
            padding: 12px 15px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            border-top: 1px solid #444;
            border-bottom: 1px solid #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="chart-block">
        <div class="label-bar">BTC:SPY Weekly</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=$BTCUSD:SPY&p=W&b=5&g=0&i=t0013046303c" alt="BTC:SPY Weekly Chart">
    </div>

    <div class="chart-block">
        <div class="label-bar">ETH:SPY Weekly</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=$ETHUSD:SPY&p=W&b=5&g=0&i=t0013046303c" alt="ETH:SPY Weekly Chart">
    </div>

    <div class="chart-block">
        <div class="label-bar">SOL:SPY Weekly</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=$SOLUSD:SPY&p=W&b=5&g=0&i=t0013046303c" alt="SOL:SPY Weekly Chart">
    </div>

    <div class="chart-block">
        <div class="label-bar">BTC:SPY Daily</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=$BTCUSD:SPY&p=D&b=5&g=0&i=t6581946801c" alt="BTC:SPY Daily Chart">
    </div>

    <div class="chart-block">
        <div class="label-bar">ETH:SPY Daily</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=$ETHUSD:SPY&p=D&b=5&g=0&i=t6581946801c" alt="ETH:SPY Daily Chart">
    </div>

    <div class="chart-block">
        <div class="label-bar">SOL:SPY Daily</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=$SOLUSD:SPY&p=D&b=5&g=0&i=t6581946801c" alt="SOL:SPY Daily Chart">
    </div>

    <div class="chart-block">
        <div class="label-bar">BTC Weekly</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=$BTCUSD&p=W&b=5&g=0&i=t0013046303c" alt="BTC Weekly Chart">
    </div>

    <div class="chart-block">
        <div class="label-bar">BTC Daily</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=$BTCUSD&p=D&b=5&g=0&i=t6581946801c" alt="BTC Daily Chart">
    </div>

    <div class="chart-block">
        <div class="label-bar">ETH Weekly</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=$ETHUSD&p=W&b=5&g=0&i=t0013046303c" alt="ETH Weekly Chart">
    </div>

    <div class="chart-block">
        <div class="label-bar">ETH Daily</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=$ETHUSD&p=D&b=5&g=0&i=t6581946801c" alt="ETH Daily Chart">
    </div>

    <div class="chart-block">
        <div class="label-bar">SOL Weekly</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=$SOLUSD&p=W&b=5&g=0&i=t0013046303c" alt="SOL Weekly Chart">
    </div>

    <div class="chart-block">
        <div class="label-bar">SOL Daily</div>
        <img class="chart-img" src="https://stockcharts.com/c-sc/sc?s=$SOLUSD&p=D&b=5&g=0&i=t6581946801c" alt="SOL Daily Chart">
    </div>

</body>
</html>
