<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Dashboard</title>
    <style>
        body {
            background-color: #0F0F0F; /* Dark background */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* The solid bar separator style */
        .symbol-header {
            background-color: #2a2e39; /* Solid blue-grey bar */
            color: #ffffff;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            border-top: 1px solid #444; /* Subtle top highlight */
            border-bottom: 1px solid #000; /* Subtle bottom shadow */
            position: relative;
        }

        .chart-container {
            width: 100%;
            height: 500px; /* Adjust height here */
            margin-bottom: 10px; /* Small gap before next header */
        }
    </style>
</head>
<body>

<div class="symbol-header">SPXL</div>
<div class="chart-container">
  <div class="tradingview-widget-container" style="height:100%;width:100%">
    <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
    {
      "allow_symbol_change": true,
      "hide_side_toolbar": true,
      "hide_legend": true,
      "hide_volume": true,
      "interval": "60",
      "style": "1",
      "symbol": "SPXL",
      "theme": "dark",
      "backgroundColor": "#0F0F0F",
      "studies": ["STD;Bollinger_Bands", "STD;MACD", "STD;Stochastic"],
      "autosize": true
    }
    </script>
  </div>
</div>
