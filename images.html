<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TNA Hourly Chart</title>
    <style>
        /* Ensure the page takes up the full screen height/width with no white borders */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents double scrolling on mobile */
            background-color: #0F0F0F; /* Matches the chart dark theme */
        }
        
        /* Container styling to ensure the widget respects the parent height */
        .full-screen-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="tradingview-widget-container full-screen-container">
        <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
        <div class="tradingview-widget-copyright">
            <a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">
                <span class="blue-text">Track all markets on TradingView</span>
            </a>
        </div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
        {
            "allow_symbol_change": true,
            "calendar": false,
            "details": false,
            "hide_side_toolbar": true,
            "hide_top_toolbar": false,
            "hide_legend": false,
            "hide_volume": false,
            "hotlist": false,
            "interval": "60",
            "locale": "en",
            "save_image": true,
            "style": "1",
            "symbol": "TNA",
            "theme": "dark",
            "timezone": "Etc/UTC",
            "backgroundColor": "#0F0F0F",
            "gridColor": "rgba(242, 242, 242, 0.06)",
            "watchlist": [
                "AMEX:SPY",
                "NASDAQ:QQQ",
                "IWM",
                "NASDAQ:TLT"
            ],
            "withdateranges": false,
            "compareSymbols": [],
            "studies": [
                "STD;Bollinger_Bands",
                "STD;MACD",
                "STD;SMA",
                "STD;Stochastic"
            ],
            "autosize": true
        }
        </script>
    </div>
    </body>
</html>
