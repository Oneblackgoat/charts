<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Relative Charts</title>
    <style>
        body {
            background-color: #0F0F0F;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .chart-block {
            width: 100%;
            margin-bottom: 15px;
            background-color: #1a1a1a;
        }

        .label-bar {
            background-color: #2a2e39; /* Blue-grey separator */
            color: #ffffff;
            padding: 12px 15px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            border-top: 1px solid #444;
            border-bottom: 1px solid #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="chart-block">
        <div class="label-bar">SVIX Weekly</div>
